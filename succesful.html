<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #31455e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h2 {
            color: #2b3e50;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            color: #57606a;
            margin-bottom: 24px;
        }

        .logout-link {
            width: 100%;
            padding: 14px;
            background-color: #dc3545;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            display: inline-block;
            transition: background-color 0.2s ease;
        }

        .logout-link:hover {
            background-color: #bb2d3b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎉 Login Successful!</h2>
        <p>Welcome back! You have successfully logged into your account.</p>
        
        <a href="./index.html" class="logout-link">Logout</a>
    </div>

</body>
</html>
